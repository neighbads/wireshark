name: Build MacOS

on: [push]

permissions:
  contents: write

jobs:
  macos:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install deps
        run: ./tools/macos-setup-brew.sh --install-required --install-optional --install-doc-deps --install-dmg-deps --install-test-deps
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - name: Install pytest
        run: pip3 install pytest pytest-xdist
      - name: Install dmgbuild
        run: pip3 install dmgbuild
      - name: Mkdir
        run: mkdir build
      - name: Cmake
        working-directory: build
        run: cmake -GNinja ..
      - name: Build
        run: ninja
        working-directory: build
      - name: Build test-programs
        run: ninja test-programs
        working-directory: build
      - name: Run tests
        run: pytest
        working-directory: build
      - name: Build dmg
        run: ninja wireshark_dmg
        working-directory: build
      - name: Upload dmg packages
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: build/run/*dmg

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          DMG=$(ls build/run/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "Error: dmg not found"
            exit 1
          fi
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "$DMG" --clobber
          else
            gh release create "${TAG}" --title "Wireshark ${TAG#v}" --generate-notes "$DMG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
